site_name: SDET Andrei Zayats
site_url: https://andrei-zayats.github.io/cv-sdet/

repo_url: https://github.com/Andrei-Zayats/cv-sdet
repo_name: cv-sdet

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list

theme:
  name: material
  language: en
  font:
    text: Inter
  icon:
    logo: material/home-assistant
  palette:
    scheme: default
    primary: teal
    accent: teal
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
  plugins:
    - search

nav:
  - Profile: index.md
  - Experience: experience.md
  - About: about.md